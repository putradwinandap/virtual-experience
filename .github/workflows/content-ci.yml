name: Content CI

on:
  pull_request:
    paths:
      - "experiences/**"
      - "scripts/validate_experiences.py"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/content-ci.yml"
      - "EXPERIENCE_TEMPLATE.md"
      - "docs/project/experience-model.md"
      - "docs/project/taxonomy.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run validator tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate experience library
        run: python scripts/validate_experiences.py
